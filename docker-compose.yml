services:
  backend:
    build: ./backend
    container_name: erp_backend
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - mysql
    networks:
      - red_erp

  mysql:
    image: mysql:8.0
    container_name: erp_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gp_systems
    ports:
      - "3306:3306"
    volumes:
      - mysql_datos:/var/lib/mysql
    networks:
      - red_erp

  frontend:
    image: node:20
    container_name: erp_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "4200:4200"
    command: sh -c "npm install && ng serve --host 0.0.0.0 --port 4200"
    depends_on:
      - backend
    networks:
      - red_erp

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: erp_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: host.docker.internal
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
      MYSQL_ROOT_PASSWORD: root
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mysql
    networks:
      - red_erp

volumes:
  mysql_datos:

networks:
  red_erp:
    driver: bridge